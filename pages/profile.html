<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>
  <link rel="stylesheet" href="../style/global.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css" />
  <link rel="stylesheet" href="../style/navbar.css">
  <style>
    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 34px 20px 22px;
      gap: 12px;
      background: linear-gradient(135deg, rgba(108,99,255,0.92), rgba(148,163,255,0.82));
      border-radius: 32px;
      box-shadow: 0 30px 60px rgba(84,79,255,0.18);
      color: #fff;
      margin: 16px 0;
    }
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: white;
    }
    .profile-name {
      font-size: 20px;
      font-weight: 700;
    }
    .profile-badge {
      background: #EEF0FF;
      color: var(--primary);
      font-size: 13px;
      padding: 4px 14px;
      border-radius: 20px;
      font-weight: 600;
    }

    /* Stats Row */
    .stats-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 0;
    }
    .stat-box {
      flex: 1;
      background: var(--white);
      border-radius: var(--radius);
      padding: 14px 10px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }
    .stat-val {
      font-size: 22px;
      font-weight: 700;
      color: var(--primary);
    }
    .stat-label {
      font-size: 11px;
      color: var(--subtext);
      margin-top: 4px;
    }

    /* Name Edit */
    .name-edit-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .name-edit-row input {
      flex: 1;
      padding: 10px 12px;
      border: 1.5px solid #E5E7EB;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      color: var(--text);
    }
    .name-edit-row input:focus {
      border-color: var(--primary);
    }
    .name-edit-row button {
      padding: 10px 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Intentions */
    .intention-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .intention-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: var(--text);
    }
    .intention-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .intention-item span.done {
      text-decoration: line-through;
      color: var(--subtext);
    }
    .add-intention-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .add-intention-row input {
      flex: 1;
      padding: 9px 12px;
      border: 1.5px solid #E5E7EB;
      border-radius: 10px;
      font-size: 13px;
      outline: none;
      color: var(--text);
    }
    .add-intention-row input:focus {
      border-color: var(--primary);
    }
    .add-intention-row button {
      padding: 9px 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
    }

    .metric-grid {
      display: grid;
      gap: 16px;
    }

    .metric-row {
      display: grid;
      gap: 10px;
    }

    .metric-row label {
      font-size: 13px;
      color: var(--subtext);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .metric-row span {
      font-size: 13px;
      color: var(--text);
    }

    .metric-row input[type="range"] {
      width: 100%;
    }

    .metric-row input[type="number"] {
      width: 100%;
      border-radius: 14px;
      padding: 12px 14px;
      border: 1.5px solid rgba(100,116,139,0.22);
      background: rgba(255,255,255,0.82);
      color: var(--text);
    }
    body.dark .metric-row input[type="number"] {
      background: rgba(255,255,255,0.07) !important;
      border-color: rgba(148,163,184,0.30) !important;
      color: #E2E8F0 !important;
    }

    .metric-row input[type="number"]:focus,
    .metric-row input[type="range"]:focus {
      border-color: var(--primary);
    }

    .session-card {
      background: rgba(255,255,255,0.88);
      border: 1px solid rgba(108,99,255,0.14);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 16px 40px rgba(108,99,255,0.08);
      backdrop-filter: blur(16px);
    }

    .session-card .session-header {
      font-weight: 700;
      color: var(--text);
      margin-bottom: 12px;
    }

    .session-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px 18px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
    }

    .session-grid span:last-child {
      color: var(--text);
      font-weight: 700;
    }

    /* Recent Insights */
    .insight-item {
      display: flex;
      gap: 8px;
      font-size: 14px;
      color: var(--text);
      line-height: 1.5;
      padding: 6px 0;
      border-bottom: 1px solid #F3F4F6;
    }
    .insight-item:last-child {
      border-bottom: none;
    }

    /* Clear Data */
    .clear-btn {
      display: block;
      margin: 8px 0 24px;
      width: 100%;
      padding: 13px;
      background: #FEE2E2;
      color: #EF4444;
      border: none;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .clear-btn:hover {
      background: #FECACA;
    }
    .logout-btn {
      margin-top: 12px;
      padding: 10px 14px;
      width: 100%;
      border: 1.5px solid #E5E7EB;
      border-radius: 12px;
      background: white;
      color: var(--primary);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .logout-btn:hover {
      background: #F3F4F6;
    }
  </style>
</head>
<body>
  <div class="page-loader"></div>
  <button class="theme-toggle" id="themeToggle">🌙 Dark</button>

  <div class="page-wrap">
  <!-- Profile Header -->
  <div class="profile-header" data-aos="fade-right">
    <div class="avatar" id="avatarEmoji">😊</div>
    <div class="profile-name" id="displayName">Your Name</div>
    <div class="profile-badge">💙 Self-Care Enthusiast</div>
    <button class="logout-btn" id="logoutBtn">Logout</button>
  </div>

  <!-- Stats Row -->
  <div class="stats-row" data-aos="fade-up">
    <div class="stat-box">
      <div class="stat-val" id="profileStreak">0</div>
      <div class="stat-label">Day Streak 🔥</div>
    </div>
    <div class="stat-box">
      <div class="stat-val" id="profileAvg">😐</div>
      <div class="stat-label">Avg Mood</div>
    </div>
    <div class="stat-box">
      <div class="stat-val" id="profileHappy">0%</div>
      <div class="stat-label">Happy Days</div>
    </div>
  </div>

  <!-- Edit Name -->
  <div class="section-title">Your Name</div>
  <div class="card" data-aos="fade-up">
    <div class="name-edit-row">
      <input type="text" id="nameInput" placeholder="Enter your name...">
      <button id="saveNameBtn">Save</button>
    </div>
  </div>

  <!-- Intentions -->
  <div class="section-title">Intentions</div>
  <div class="card" data-aos="fade-up">
    <div class="intention-row" id="intentionList"></div>
    <div class="add-intention-row">
      <input type="text" id="intentionInput" placeholder="Add a new intention...">
      <button id="addIntentionBtn">+</button>
    </div>
  </div>

  <div class="section-title">Wellness</div>
  <div class="card">
    <p style="color:var(--subtext); line-height:1.6; margin-bottom: 12px;">
      Track your daily wellness metrics and session history on a dedicated page.
    </p>
    <button onclick="window.location.href='wellness.html'">Open Wellness Page</button>
  </div>

  <!-- Recent Insights -->
  <div class="section-title">Recent Insights</div>
  <div class="card" id="recentInsights" data-aos="fade-up"></div>

  <!-- Clear Data -->
  <button class="clear-btn" id="clearBtn">🗑 Clear All My Data</button>
  </div><!-- /.page-wrap -->

  <nav class="navbar">
    <a href="home.html"><span class="icon">🏠</span> Home</a>
    <a href="journal.html"><span class="icon">📓</span> Journal</a>
    <a href="analytics.html"><span class="icon">📊</span> Analytics</a>
    <a href="wellness.html"><span class="icon">🧘</span> Wellness</a>
    <a href="profile.html" class="active"><span class="icon">👤</span> Profile</a>
  </nav>

  <script src="../js/auth.js"></script>
  <script src="../js/storage.js"></script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/profile.js"></script>
</body>
</html>
