<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics</title>
  <link rel="stylesheet" href="../style/global.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css" />
  <link rel="stylesheet" href="../style/navbar.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .header {
      padding: 20px 16px 8px;
    }
    .header h1 { font-size: 22px; }
    .header p { color: var(--subtext); font-size: 14px; margin-top: 4px; }

    /* Stats Row */
    .stats-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 0;
      margin-bottom: 4px;
    }
    .stat-box {
      flex: 1;
      background: var(--white);
      border-radius: var(--radius);
      padding: 14px 10px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }
    .stat-box .stat-val {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
    }
    .stat-box .stat-label {
      font-size: 11px;
      color: var(--subtext);
      margin-top: 4px;
    }

    /* Chart */
    .chart-wrapper {
      padding: 8px 4px 0;
    }

    /* Emotion Breakdown */
    .breakdown-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .breakdown-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .breakdown-label {
      width: 70px;
      font-size: 13px;
      color: var(--text);
    }
    .breakdown-bar-bg {
      flex: 1;
      height: 10px;
      background: rgba(255,255,255,0.18);
      border-radius: 10px;
      overflow: hidden;
    }
    .breakdown-bar {
      height: 100%;
      border-radius: 10px;
      background: var(--primary);
      transition: width 0.4s ease;
    }
    .breakdown-pct {
      font-size: 12px;
      color: var(--subtext);
      width: 32px;
      text-align: right;
    }

    /* Insight Box */
    .insight-box {
      background: var(--surface);
      border-left: 4px solid var(--primary);
      border-radius: 20px;
      padding: 18px;
      margin: 12px 0;
      font-size: 14px;
      color: var(--text);
      line-height: 1.75;
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px);
    }
    .insight-box strong {
      display: block;
      margin-bottom: 8px;
      color: var(--primary);
    }
    .insight-box span {
      display: block;
      color: var(--text);
      opacity: 0.95;
    }
  </style>
</head>
<body>
  <div class="page-loader"></div>
  <button class="theme-toggle" id="themeToggle">🌙 Dark</button>

  <div class="page-wrap">
  <div class="header" data-aos="fade-down">
    <h1 class="text-3xl font-semibold tracking-tight">📊 Analytics</h1>
    <p>Your mood patterns this week</p>
  </div>

  <!-- Stats Row -->
  <div class="stats-row" data-aos="fade-up">
    <div class="stat-box">
      <div class="stat-val" id="statStreak">0</div>
      <div class="stat-label">Day Streak 🔥</div>
    </div>
    <div class="stat-box">
      <div class="stat-val" id="statAvg">😐</div>
      <div class="stat-label">Avg Mood</div>
    </div>
    <div class="stat-box">
      <div class="stat-val" id="statHappy">0%</div>
      <div class="stat-label">Happy Days</div>
    </div>
  </div>

  <!-- Key Metrics -->
  <div class="card" style="margin-top: 6px;" data-aos="fade-up">
    <div class="metrics-grid" id="keyMetrics"></div>
  </div>

  <!-- Mood This Week Chart -->
  <div class="section-title">Mood This Week</div>
  <div class="card" data-aos="fade-up">
    <div class="chart-wrapper">
      <canvas id="moodChart" height="160"></canvas>
    </div>
  </div>

  <!-- Emotion Breakdown -->
  <div class="section-title">Emotion Breakdown</div>
  <div class="card" data-aos="fade-up">
    <div class="breakdown-row" id="breakdownRow"></div>
  </div>

  <!-- Insight of the Week -->
  <div class="insight-box" id="insightBox" data-aos="fade-up">
    <strong>💡 Insight of the Week</strong>
    <span id="insightText">Log more entries to get insights!</span>
  </div>
  </div><!-- /.page-wrap -->

  <nav class="navbar">
    <a href="home.html"><span class="icon">🏠</span> Home</a>
    <a href="journal.html"><span class="icon">📓</span> Journal</a>
    <a href="analytics.html" class="active"><span class="icon">📊</span> Analytics</a>
    <a href="wellness.html"><span class="icon">🧘</span> Wellness</a>
    <a href="profile.html"><span class="icon">👤</span> Profile</a>
  </nav>

  <script src="../js/auth.js"></script>
  <script src="../js/storage.js"></script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/analytics.js"></script>
</body>
</html>
